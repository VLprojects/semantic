  <g transform="translate(12,12)">
    <rect x="16" y="16" width="968" height="462" rx="12" fill="#FFFFFF"/>
    <text x="40.0" y="52.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2328" text-anchor="start">Outgoing calls to a partner</text>
    <text x="40.0" y="76.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#59636E" text-anchor="start">spring/web: the partner allows 4 calls a second. The application sends 8 calls at once, maxWait is 1.5 s</text>
